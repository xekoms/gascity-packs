name: Claude Code

# Shared on-demand coding/review route; automatic reviews remain separate.
on:
  workflow_dispatch:
    inputs:
      billing:
        description: "Credential route"
        type: choice
        options: [subscription, api]
        default: subscription
        required: true
      prompt:
        description: "Task or review request; include the issue/PR URL when relevant"
        type: string
        required: true
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-interactive-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.prompt != '' && (inputs.billing == 'subscription' || inputs.billing == 'api')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.author_association == 'OWNER') ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.actor == github.repository_owner)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      # Do not inherit an alternate provider credential from the runner.
      ANTHROPIC_API_KEY: ""
      CLAUDE_CODE_OAUTH_TOKEN: ""
      CLAUDE_CODE_USE_BEDROCK: ""
      CLAUDE_CODE_USE_VERTEX: ""
      CLAUDE_CODE_USE_FOUNDRY: ""
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Classify invocation and billing
        id: route
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // BEGIN CLAUDE ROUTING
            const payload = context.payload;
            const isOwner = String(context.actor).toLowerCase() === String(context.repo.owner).toLowerCase();
            let authorized = false;
            let texts = [];
            let billing = "";
            if (context.eventName === "workflow_dispatch") {
              authorized = isOwner && typeof payload.inputs?.prompt === "string" && payload.inputs.prompt.trim() !== "";
              billing = payload.inputs?.billing;
              authorized = authorized && ["subscription", "api"].includes(billing);
            } else if (context.eventName === "issues") {
              authorized = payload.action === "opened"
                ? payload.issue?.author_association === "OWNER"
                : payload.action === "assigned" && isOwner;
              texts = [payload.issue?.title, payload.issue?.body];
            } else if (["issue_comment", "pull_request_review_comment"].includes(context.eventName)) {
              authorized = payload.action === "created" && payload.comment?.author_association === "OWNER";
              texts = [payload.comment?.body];
            } else if (context.eventName === "pull_request_review") {
              authorized = payload.action === "submitted" && payload.review?.author_association === "OWNER";
              texts = [payload.review?.body];
            }
            if (context.eventName !== "workflow_dispatch") {
              // Match upstream checkContainsTrigger word boundaries and case rules exactly.
              const api = texts.some(text => /(^|\s)@claude-api([\s.,!?;:]|$)/i.test(text || ""));
              const subscription = texts.some(text => /(^|\s)@claude([\s.,!?;:]|$)/i.test(text || ""));
              billing = api ? "api" : subscription ? "subscription" : "";
            }
            const shouldRun = Boolean(authorized && billing);
            core.setOutput("should_run", String(shouldRun));
            core.setOutput("billing", shouldRun ? billing : "");
            core.setOutput("trigger", shouldRun ? billing === "api" ? "@claude-api" : "@claude" : "");
            // END CLAUDE ROUTING

      - name: Checkout repository
        if: steps.route.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.route.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          trigger_phrase: ${{ steps.route.outputs.trigger }}
          anthropic_api_key: ${{ steps.route.outputs.billing == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.route.outputs.billing == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || (github.event_name == 'issues' && github.event.action == 'assigned' && format('{0} {1}', github.event.issue.title, github.event.issue.body)) || '' }}
          additional_permissions: |
            actions: read
